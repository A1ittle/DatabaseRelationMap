server:
  port: 8080

spring:
  application:
    name: lineage-api
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Default off so local/CI without PostgreSQL still serves /api/health.
    # When SPRING_DATASOURCE_URL is set, OptionalDataSourceEnvironmentPostProcessor
    # turns Flyway on unless FLYWAY_ENABLED=false. Profile `db` (application-db.yml)
    # is the explicit SRE opt-in.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

lineage:
  security:
    # open: no SSO (local/dev). demo-header: require X-Lineage-Demo-User.
    # OIDC is a later task — do not set production secrets here.
    # Optional X-Embed-Groups: g1,g2 resolves scope_grant/object_grant (deny wins).
    # Omit the header in open mode to authorize every object in the active snapshot.
    # When the header is present, POST /api/imports and .../publish require scope_grant
    # permission=ingest on the target scope; missing grant → 403 FORBIDDEN.
    mode: ${LINEAGE_SECURITY_MODE:open}
  csrf:
    # Compared (constant-time) to header X-CSRF-Token on POST /api/imports* and POST /api/lineage*.
    # Local/open docs keep `dev`. Hosts must set a non-guessable token for real embeds.
    token: ${LINEAGE_CSRF_TOKEN:dev}
  cors:
    # Comma-separated exact Origins. Never echo an arbitrary Origin.
    # Prefer same-origin reverse-proxy (no Origin header, no ACAO needed).
    allowed-origins: ${LINEAGE_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
