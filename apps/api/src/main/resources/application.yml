server:
  port: 8080

spring:
  application:
    name: lineage-api
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Default off so local/CI without PostgreSQL still serves /api/health.
    # When SPRING_DATASOURCE_URL is set, OptionalDataSourceEnvironmentPostProcessor
    # turns Flyway on unless FLYWAY_ENABLED=false. Profile `db` (application-db.yml)
    # is the explicit SRE opt-in.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

lineage:
  security:
    # open: no SSO (local/dev). demo-header: require X-Lineage-Demo-User.
    # OIDC is a later task — do not set production secrets here.
    mode: ${LINEAGE_SECURITY_MODE:open}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
