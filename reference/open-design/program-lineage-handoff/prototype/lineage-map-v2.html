<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>程序血缘地图 · 下游树</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg:      oklch(22% 0.02 240);
      --muted:   oklch(42% 0.02 240);
      --border:  oklch(90% 0.008 240);
      --accent:  oklch(58% 0.16 145);
      --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --success: oklch(40% 0.11 145);
      --warn:    oklch(44% 0.12 75);
      --danger:  oklch(46% 0.16 25);
      --table:   oklch(38% 0.04 250);
      --view:    oklch(38% 0.07 200);
      --proc:    oklch(40% 0.09 75);
      --java:    oklch(36% 0.06 280);
      --inspect-w: 320px;
      --radius: 6px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --hover: oklch(96% 0.006 250);
      --press: oklch(93% 0.008 250);
      --fg-hover: oklch(16% 0.02 240);
      --fg-press: oklch(10% 0.02 240);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg); color: var(--fg);
      font-size: 14px; line-height: 1.7;
      min-height: 100dvh; overflow: hidden;
      color-scheme: light;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip {
      position: absolute; left: -999px; top: 8px; background: var(--fg); color: var(--surface);
      padding: 8px 12px; z-index: 30; border-radius: var(--radius); font-weight: 510;
    }
    .skip:focus { left: 8px; }
    .app {
      height: 100dvh; display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      min-width: 0; overflow: hidden;
    }
    .header, .toolbar, .summary, .footer { background: var(--surface); border-bottom: 1px solid var(--border); }
    .header {
      display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
      min-height: 56px; padding: 8px 16px 8px 20px;
    }
    .brand { min-width: 0; }
    .brand-kicker {
      font-size: 12px; letter-spacing: 0.02em; color: var(--muted); line-height: 1.4; margin: 0;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.35; }
    .seed-wrap, .scale { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .seed-wrap label, .scale span { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; }
    select, .search input {
      height: 44px; padding: 0 10px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg); min-width: 0;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
    }
    #seed { max-width: 280px; }
    select:hover, .search input:hover { background: var(--hover); }
    select:focus-visible, .search input:focus-visible, button:focus-visible {
      outline: 2px solid var(--fg); outline-offset: 2px;
    }
    .search { margin-left: auto; position: relative; min-width: 0; }
    .search input { width: min(280px, 32vw); padding-left: 36px; }
    .search svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--muted); pointer-events: none;
    }
    .hits {
      position: absolute; right: 0; top: calc(100% + 4px); width: min(400px, 86vw);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 12px 32px oklch(20% 0.02 240 / 0.12); z-index: 12;
      max-height: 320px; overflow: auto; padding: 4px;
    }
    .hits button {
      display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center;
      width: 100%; text-align: left; padding: 8px 10px; border: 0; background: transparent;
      min-height: 44px; border-radius: var(--radius);
    }
    .hits button:hover, .hits button.is-active { background: var(--hover); }
    .hits .empty-hit { margin: 0; padding: 14px 12px; font-size: 13px; color: var(--muted); line-height: 1.7; }
    .toolbar { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 8px 16px; }
    .modes { display: flex; padding: 3px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .modes button {
      height: 44px; padding: 0 14px; border: 0; background: transparent;
      border-radius: 5px; font-size: 13px; font-weight: 510; letter-spacing: 0.02em;
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }
    .modes button:hover { background: var(--hover); color: var(--fg); }
    .modes button[aria-selected="true"] { background: var(--fg); color: var(--surface); }
    .modes button[aria-selected="true"]:hover { background: var(--fg-hover); color: var(--surface); }
    .modes button[aria-selected="true"]:active { background: var(--fg-press); color: var(--surface); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
    .chip, .seg button, .more, .state-card button, .inspect-toggle {
      height: 44px; min-height: 44px; padding: 0 12px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--surface); font-size: 12px; letter-spacing: 0.02em;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }
    .chip { background: var(--bg); color: var(--muted); }
    .chip:hover, .more:hover, .cluster:hover, .inspect-toggle:hover { background: var(--hover); color: var(--fg); }
    .chip:active, .more:active, .cluster:active { background: var(--press); }
    .chip[aria-pressed="true"] {
      background: var(--surface); color: var(--fg); border-color: var(--fg);
      box-shadow: inset 0 0 0 1px var(--fg);
    }
    .chip[aria-pressed="true"]:hover { background: var(--hover); color: var(--fg); }
    .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    .dot-table { background: var(--table); } .dot-view { background: var(--view); }
    .dot-procedure { background: var(--proc); } .dot-java { background: var(--java); }
    .seg { display: flex; }
    .seg button { border-radius: 0; }
    .seg button:first-child { border-radius: 999px 0 0 999px; }
    .seg button:last-child { border-radius: 0 999px 999px 0; margin-left: -1px; }
    .seg button:hover { background: var(--hover); color: var(--fg); }
    .seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); z-index: 1; }
    .seg button[aria-pressed="true"]:hover { background: var(--fg-hover); color: var(--surface); }
    .seg button[aria-pressed="true"]:active { background: var(--fg-press); color: var(--surface); }
    .legend {
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
      font-size: 12px; color: var(--muted); letter-spacing: 0.02em; justify-self: end;
    }
    .legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid oklch(62% 0.01 240); vertical-align: middle; margin-right: 6px; }
    .legend .cross-swatch { border-top-style: dashed; border-top-color: oklch(44% 0.04 250); }
    .summary {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: start;
      padding: 8px 20px 10px; line-height: 1.7;
    }
    .summary p { margin: 0; font-size: 14px; max-width: 72ch; }
    .summary b { font-weight: 600; }
    .why { color: var(--muted); font-size: 13px; margin-top: 2px !important; }
    .body { display: grid; grid-template-columns: minmax(0, 1fr) var(--inspect-w); min-height: 0; min-width: 0; }
    .stage-wrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .stage {
      min-width: 0; min-height: 0; overflow: auto; position: relative; flex: 1;
      background:
        linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--bg);
    }
    .stage-inner { position: relative; min-height: 100%; }
    .canvas-state {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: oklch(98% 0.005 250 / 0.94); z-index: 6; padding: 24px;
    }
    .canvas-state[hidden] { display: none !important; }
    .state-card {
      width: min(380px, 100%); text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 24px 20px;
    }
    .state-card h2 { font-size: 16px; margin: 0 0 8px; line-height: 1.35; font-weight: 600; }
    .state-card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .state-card button { width: 100%; border-radius: var(--radius); background: var(--fg); color: var(--surface); border-color: var(--fg); }
    .state-card button:hover { background: var(--fg-hover); color: var(--surface); }
    .state-card button:active { background: var(--fg-press); color: var(--surface); }
    .state-card .ghost { background: var(--surface); color: var(--fg); border-color: var(--border); margin-top: 8px; }
    .state-card .ghost:hover { background: var(--hover); color: var(--fg); }
    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--fg);
      border-radius: 50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .edge-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .edge { fill: none; stroke: oklch(72% 0.01 240); stroke-width: 1.25; }
    .edge.calls { stroke-dasharray: 5 4; } .edge.derives { stroke-dasharray: 2 3; }
    .edge.cross { stroke: oklch(44% 0.04 250); stroke-width: 1.35; stroke-dasharray: 4 3.5; }
    .edge.dim { opacity: 0.22; } .edge.on { stroke: var(--accent); stroke-width: 2; opacity: 1; }
    .hops { display: grid; gap: 0 12px; padding: 20px 24px 56px; position: relative; z-index: 1; min-width: max-content; }
    .col { display: flex; flex-direction: column; gap: 8px; min-width: 240px; max-width: 280px; }
    .col-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      padding: 0 4px 8px; border-bottom: 1px solid var(--border);
    }
    .col-head .k { font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }
    .col-head .n { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 510; }
    .col.leaf-col { background: oklch(97% 0.012 280); border-radius: 10px; padding: 8px; }
    .node, .cluster {
      display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center;
      width: 100%; text-align: left; padding: 10px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); min-height: 52px;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
    }
    .cluster { grid-template-columns: minmax(0, 1fr); gap: 6px; border-radius: 10px; min-height: 72px; }
    .node:hover { background: var(--hover); border-color: oklch(78% 0.02 240); }
    .node:active { background: var(--press); }
    .node.is-seed { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(58% 0.16 145 / 0.18); min-height: 72px; }
    .node.is-sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
    .node.is-seed.is-sel { box-shadow: 0 0 0 3px oklch(58% 0.16 145 / 0.18), inset 0 0 0 1px var(--fg); }
    .node.is-dim { background: var(--bg); }
    .node.is-dim .node-name, .node.is-dim .node-title { color: var(--muted); }
    .node-ico { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; color: var(--surface); flex: none; }
    .node-ico svg { width: 15px; height: 15px; }
    .t-table { background: var(--table); } .t-view { background: var(--view); }
    .t-procedure { background: var(--proc); } .t-java { background: var(--java); }
    .node-copy { min-width: 0; }
    .node-name {
      font-family: var(--font-mono); font-size: 12px; font-weight: 500; line-height: 1.45;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .node-title { display: block; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .badge {
      font-size: 12px; letter-spacing: 0.02em; color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; background: var(--bg); white-space: nowrap;
    }
    .badge.cross-b { color: var(--fg); border-color: oklch(70% 0.03 250); border-style: dashed; }
    .now { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
    .more { width: 100%; justify-content: center; border-style: dashed; border-radius: var(--radius); }
    .more[aria-expanded="true"] { background: var(--bg); color: var(--fg); border-style: solid; }
    .cluster-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
    .cluster-count { font-family: var(--font-mono); font-size: 22px; font-weight: 500; line-height: 1.3; font-variant-numeric: tabular-nums; }
    .bars { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--bg); }
    .bars i { display: block; height: 100%; }
    .impact { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr); min-height: 100%; }
    .impact-pane { padding: 16px 18px 32px; min-width: 0; }
    .impact-pane + .impact-pane, .center-card { border-left: 1px solid var(--border); }
    .impact-pane h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; line-height: 1.4; }
    .count-lg { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 28px; line-height: 1.3; font-weight: 500; margin: 0 0 12px; }
    .group { margin: 0 0 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .group h3, .group > button.ghead {
      margin: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; min-height: 44px; border: 0; background: transparent; text-align: left;
      font-size: 12px; letter-spacing: 0.02em; font-weight: 510; border-radius: 0;
    }
    .row {
      display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center;
      width: 100%; padding: 8px 12px; border: 0; border-top: 1px solid var(--border);
      background: transparent; text-align: left; min-height: 44px; border-radius: 0;
    }
    .row:hover, .ghead:hover { background: var(--hover); }
    .row:active, .ghead:active { background: var(--press); }
    .row.is-sel { background: oklch(97% 0.01 250); box-shadow: inset 2px 0 0 var(--fg); }
    .rel-list .row { grid-template-columns: auto minmax(0, 1fr); }
    .center-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; background: var(--surface); }
    .center-card .node { width: min(100%, 220px); }
    .flow-arrow { color: var(--muted); font-size: 12px; margin: 16px 0; }
    .path-wrap { padding: 20px 28px 48px; max-width: 760px; }
    .path-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
    .path-bar span, .path-bar label { color: var(--muted); font-size: 12px; }
    .path-bar select { min-width: min(280px, 100%); }
    .steps { list-style: none; margin: 0; padding: 0; }
    .step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; }
    .rail { display: flex; flex-direction: column; align-items: center; }
    .rail i { width: 10px; height: 10px; border-radius: 50%; background: var(--fg); display: block; margin-top: 18px; }
    .rail i.seed { background: var(--accent); box-shadow: 0 0 0 4px oklch(58% 0.16 145 / 0.2); }
    .rail i.cross { background: oklch(44% 0.04 250); }
    .rail b { width: 1px; flex: 1; background: var(--border); min-height: 12px; display: block; }
    .step article { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; min-width: 0; }
    .step article.is-seed { border-color: var(--accent); }
    .rel-line { font-size: 12px; letter-spacing: 0.02em; color: var(--muted); margin: 0 0 8px; }
    .inspector-wrap {
      border-left: 1px solid var(--border); background: var(--surface);
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
    }
    .inspect-bar {
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; min-height: 52px; border-bottom: 1px solid var(--border); flex: none;
    }
    .inspect-bar-title { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
    .inspect-toggle { flex: none; }
    .inspector { padding: 16px 16px 24px; overflow: auto; min-height: 0; flex: 1; }
    .inspector h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.4; }
    .mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .kv { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 8px; margin: 14px 0; font-size: 13px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .rel-list { list-style: none; margin: 0; padding: 0; }
    .rel-list li { border: 0; }
    .empty { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .pill-status { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; }
    .st-verified { background: oklch(95% 0.03 145); color: var(--success); }
    .st-inferred { background: oklch(96% 0.04 75); color: var(--warn); }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .actions button {
      height: 44px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); letter-spacing: 0.02em;
      transition: background 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
    }
    .actions button:hover { background: var(--hover); color: var(--fg); }
    .actions button:active { background: var(--press); color: var(--fg); }
    .actions .primary { background: var(--fg); color: var(--surface); border-color: var(--fg); }
    .actions .primary:hover { background: var(--fg-hover); color: var(--surface); }
    .actions .primary:active { background: var(--fg-press); color: var(--surface); }
    .footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 40px; padding: 6px 16px; border-top: 1px solid var(--border); border-bottom: 0;
      font-size: 12px; color: var(--muted); letter-spacing: 0.02em;
    }
    kbd {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
      border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px;
      padding: 1px 5px; background: var(--bg); color: var(--fg);
    }
    @media (max-width: 960px) {
      .body { grid-template-columns: 1fr; grid-template-rows: minmax(38vh, 1fr) auto; }
      .inspector-wrap { border-left: 0; border-top: 1px solid var(--border); max-height: 46vh; }
      .inspector-wrap.is-collapsed { max-height: none; }
      .inspector-wrap.is-collapsed .inspector { display: none; }
      .inspect-bar { display: flex; }
      .impact { grid-template-columns: 1fr; }
      .impact-pane + .impact-pane, .center-card { border-left: 0; border-top: 1px solid var(--border); }
      .search { margin-left: 0; width: 100%; order: 5; }
      .search input { width: 100%; font-size: 16px; }
      #seed { max-width: none; width: 100%; font-size: 16px; }
      .seed-wrap { flex: 1 1 180px; }
      .scale { flex: 1 1 160px; }
      .summary { grid-template-columns: 1fr; padding: 8px 16px; }
      .legend { justify-self: start; }
      .filters { margin-left: 0; }
      .path-wrap { padding: 16px 16px 32px; }
    }
    @media (max-width: 640px) {
      .modes { width: 100%; }
      .modes button { flex: 1; padding: 0 8px; font-size: 12px; }
      .footer { flex-wrap: wrap; height: auto; padding: 8px 16px; }
      .kbd-help { display: none; }
      h1 { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .spinner { border-top-color: var(--fg); }
    }
  </style>
</head>
<body>
  <a class="skip" href="#stage">跳到血缘画布</a>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div class="app" data-od-id="app">
    <header class="header" data-od-id="header">
      <div class="brand">
        <p class="brand-kicker">下游树 · Java 为终端</p>
        <h1 data-od-id="title">程序血缘地图</h1>
      </div>
      <div class="seed-wrap">
        <label for="seed">输入表</label>
        <select id="seed" data-od-id="seed-select" aria-label="选择作为根的表"></select>
      </div>
      <div class="scale" role="group" aria-label="示例规模" data-od-id="scale">
        <span>规模</span>

    const CORE_EDGES = [
      ['core.t_order','sp_sync','reads'],['sp_sync','ods.trade_order','writes'],

    ];
    const TOPICS = ['退款','优惠','运费','发票','评价','物流','售后','会员','积分','券','渠道','门店','直播','广告','库存','结算','分账','补贴','客服','质检'];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function buildGraph(scale) {
      const nodes = CORE.map((n) => ({ ...n }));
      const edges = CORE_EDGES.map(([from, to, rel]) => ({ from, to, rel }));
      if (scale === 'small') return { nodes, edges };
      const add = (n) => { nodes.push(n); return n.id; };
      const link = (from, to, rel) => edges.push({ from, to, rel });
      const fan = (count, make, parent, rel) => {
        for (let i = 1; i <= count; i++) link(parent, add(make(i)), rel);
      };
      const fanIn = (count, make, child, rel) => {
        for (let i = 1; i <= count; i++) link(add(make(i)), child, rel);
      };
      fanIn(24, (i) => ({ id: `core.hist_${i}`, name: `core.t_order_hist_${i}`, title: `核心订单历史分片 ${i}`, type: 'table', owner: '核心交易', system: 'Oracle', status: 'verified', desc: '核心库历史分表。' }), 'sp_sync', 'reads');
      fanIn(16, (i) => ({ id: `pay.log_${i}`, name: `ods.pay_channel_log_${i}`, title: `支付渠道日志分片 ${i}`, type: 'table', owner: '支付中台', system: 'Hive', status: 'verified', desc: '渠道回调分表。' }), 'OrderIngestJob', 'reads');
      fanIn(12, (i) => ({ id: `acct_${i}`, name: `stg.user_account_d${i}`, title: `用户账户日切片 ${i}`, type: 'table', owner: '账户域', system: 'Hive', status: 'inferred', desc: '账户日切片。' }), 'OrderIngestJob', 'reads');
      fanIn(18, (i) => ({ id: `mer_${i}`, name: `dim.merchant_${i}`, title: `商户维表分片 ${i}`, type: 'table', owner: '商户中心', system: 'Hive', status: 'verified', desc: '商户主数据分片。' }), 'v_active_merchant', 'reads');
      TOPICS.forEach((t, i) => {
        const v = add({ id: `venr_${i}`, name: `dw.v_order_${i}`, title: `订单${t}补全视图`, type: 'view', owner: '数仓平台', system: 'Hive', status: 'inferred', desc: `从 ODS 订单补全${t}属性。` });

        const sp = add({ id: `spm_${i}`, name: `dw.sp_mart_${i}`, title: `刷新${t}集市`, type: 'procedure', owner: '数仓平台', system: 'Hive SP', status: i % 3 ? 'verified' : 'inferred', desc: `按日刷新${t}集市。` });
        link(f, sp, 'reads');
        for (let k = 1; k <= 4; k++) {
          const ads = add({ id: `ads_${i}_${k}`, name: `ads.${t}_${k}`, title: `${t}汇总 ${k}`, type: 'table', owner: '分析域', system: 'Hive', status: 'verified', desc: `${t}面向报表的汇总表。` });
          link(sp, ads, 'writes');
          if (k === 2) link('dwd.fact_order', ads, 'derives');
          if (k === 1) {
            const js = add({ id: `rpt_${i}`, name: `com.bi.${t}ReportService`, title: `${t}报表服务`, type: 'java', owner: '分析域', system: 'Java 服务', status: 'inferred', desc: `读取${t}集市的终端服务。` });
            link(ads, js, 'reads');
            if (i % 3 === 0) link(v, js, 'reads');
          }
        }
      });
      fan(36, (i) => ({ id: `risk_t_${i}`, name: `risk.order_feature_${i}`, title: `风险特征表 ${i}`, type: 'table', owner: '风控', system: 'Hive', status: 'verified', desc: '从风险分派生的特征表。' }), 'risk.order_score', 'derives');
      fan(24, (i) => ({ id: `risk_v_${i}`, name: `dw.v_risk_${i}`, title: `风险排查视图 ${i}`, type: 'view', owner: '风控', system: 'Hive', status: 'inferred', desc: '风险日视图的主题切片。' }), 'v_risk_daily', 'derives');
      fan(18, (i) => ({ id: `risk_j_${i}`, name: `com.risk.consumer.FeatureSink${i}`, title: `风险特征消费 ${i}`, type: 'java', owner: '风控', system: 'Java 服务', status: 'verified', desc: '读取风险分的终端。' }), 'risk.order_score', 'reads');
      fan(28, (i) => ({ id: `dash_${i}`, name: `ads.gmv_board_${i}`, title: `GMV 看板 ${i}`, type: 'view', owner: '分析域', system: 'Hive', status: 'inferred', desc: '经营看板用视图。' }), 'ads.merchant_gmv', 'reads');
      fan(22, (i) => ({ id: `svc_${i}`, name: `com.bi.BoardService${i}`, title: `看板服务 ${i}`, type: 'java', owner: '分析域', system: 'Java 服务', status: 'inferred', desc: '读取 GMV 集市的终端。' }), 'ads.merchant_gmv', 'reads');
      fan(40, (i) => ({ id: `factx_${i}`, name: `dwd.fact_order_ext_${i}`, title: `订单扩展事实 ${i}`, type: 'table', owner: '数仓平台', system: 'Hive', status: 'verified', desc: '从订单事实派生的扩展明细。' }), 'dwd.fact_order', 'derives');
      fan(36, (i) => ({ id: `enr_${i}`, name: `dw.v_order_ext_${i}`, title: `订单扩展视图 ${i}`, type: 'view', owner: '数仓平台', system: 'Hive', status: 'inferred', desc: '补全视图的主题切片。' }), 'v_order_enriched', 'derives');

      fan(30, (i) => ({ id: `app_${i}`, name: `com.trade.app.OrderQuery${i}`, title: `订单查询服务 ${i}`, type: 'java', owner: '交易中台', system: 'Java 服务', status: 'verified', desc: '在线读取 ODS 订单的终端。' }), 'ods.trade_order', 'reads');

    const LS = 'lineage-map-v2-tree';
    const state = {
      scale: 'large', seed: 'ods.trade_order', mode: 'focus',
      types: { table: true, view: true, procedure: true, java: true },
      depth: 1, q: '', sel: 'ods.trade_order',
      pathTo: 'GmvReportService',
      expanded: {}, openGroups: {}, openCols: {},
      inspectOpen: true
    };
    let NODES = []; let EDGES = []; let byId = {}; let TREE = null;
    let hitIndex = -1;
    let lastAnnounced = '';
    const mqMobile = window.matchMedia('(max-width: 960px)');
    try {
      const saved = JSON.parse(localStorage.getItem(LS) || 'null');
      if (saved) Object.assign(state, saved, { expanded: saved.expanded || {}, openGroups: saved.openGroups || {}, openCols: saved.openCols || {}, inspectOpen: saved.inspectOpen !== false });
    } catch (e) {}

    function liveEdges() {
      return EDGES.filter((e) => byId[e.from] && byId[e.to] && byId[e.from].type !== 'java');
    }
    function buildTree(seed) {
      const usable = liveEdges();
      const out = {};
      usable.forEach((e) => { (out[e.from] || (out[e.from] = [])).push(e); });
      const reach = new Set([seed]);
      const q = [seed];
      while (q.length) {
        const cur = q.shift();
        (out[cur] || []).forEach((e) => {
          if (!reach.has(e.to)) { reach.add(e.to); q.push(e.to); }
        });
      }
      const indeg = {};
      reach.forEach((id) => { indeg[id] = 0; });
      usable.forEach((e) => {
        if (reach.has(e.from) && reach.has(e.to)) indeg[e.to]++;
      });
      const rank = new Map([[seed, 0]]);
      const parent = new Map();
      const parentEdge = new Map();
      const tq = [];
      reach.forEach((id) => { if (indeg[id] === 0) tq.push(id); });
      const seen = new Set();
      while (tq.length) {
        const u = tq.shift();
        if (seen.has(u)) continue;
        seen.add(u);
        (out[u] || []).forEach((e) => {
          if (!reach.has(e.to)) return;
          const cand = (rank.get(u) || 0) + 1;
          const prev = rank.get(e.to);
          const better = prev == null || cand > prev || (cand === prev && STRENGTH[e.rel] > STRENGTH[(parentEdge.get(e.to) || {}).rel]);
          if (better) { rank.set(e.to, cand); parent.set(e.to, u); parentEdge.set(e.to, e); }
          indeg[e.to]--;
          if (indeg[e.to] === 0) tq.push(e.to);
        });
      }
      reach.forEach((id) => { if (!rank.has(id)) rank.set(id, id === seed ? 0 : 1); });
      const treeKey = new Set();
      parentEdge.forEach((e) => treeKey.add(e.from + '>' + e.to));
      const tree = [];
      const cross = [];
      usable.forEach((e) => {
        if (!reach.has(e.from) || !reach.has(e.to) || e.from === e.to) return;
        (treeKey.has(e.from + '>' + e.to) ? tree : cross).push(e);
      });
      const children = {};
      tree.forEach((e) => { (children[e.from] || (children[e.from] = [])).push(e.to); });
      const crossOf = {};
      cross.forEach((e) => {
        (crossOf[e.from] || (crossOf[e.from] = [])).push(e);
        (crossOf[e.to] || (crossOf[e.to] = [])).push(e);
      });
      return { rank, parent, parentEdge, reach, tree, cross, children, crossOf };
    }
    function loadCatalog() {
      const g = buildGraph(state.scale);
      NODES = g.nodes; EDGES = g.edges;
      byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
      if (!byId[state.seed] || byId[state.seed].type !== 'table') state.seed = 'ods.trade_order';
      if (!byId[state.sel]) state.sel = state.seed;
      TREE = buildTree(state.seed);
      if (!TREE.reach.has(state.sel)) state.sel = state.seed;
      if (!byId[state.pathTo] || !TREE.reach.has(state.pathTo)) {

      box.innerHTML = hits.map((n, i) => `<button type="button" role="option" id="hit-${i}" data-id="${esc(n.id)}"><span class="node-ico ${TYPES[n.type].cls}">${ICO[n.type]}</span><span class="node-copy"><span class="node-name">${esc(n.name)}</span><span class="node-title">${esc(n.title)} · ${esc(n.owner)}${TREE.reach.has(n.id) ? '' : ' · 不在当前下游'}</span></span><span class="badge">${n.type === 'java' ? '终端' : TYPES[n.type].label}</span></button>`).join('');
    }
    function moveHit(dir) {
      const opts = [...document.querySelectorAll('#hits [data-id]')];
      if (!opts.length) return;
      hitIndex = (hitIndex + dir + opts.length) % opts.length;
      opts.forEach((el, i) => el.classList.toggle('is-active', i === hitIndex));
      opts[hitIndex].scrollIntoView({ block: 'nearest' });
      document.getElementById('q').setAttribute('aria-activedescendant', opts[hitIndex].id);
    }
    function chooseHit() {
      const opts = [...document.querySelectorAll('#hits [data-id]')];
      if (!opts.length) return;
      const el = opts[Math.max(hitIndex, 0)];
      reveal(el.getAttribute('data-id'));
      state.q = ''; document.getElementById('q').value = '';
      document.getElementById('hits').hidden = true;
      render();
    }
    function setMode(mode) {
      state.mode = mode;
      document.getElementById('stage').setAttribute('aria-labelledby', 'tab-' + mode);
      render();
    }
    function resetTypes() {
      state.types = { table: true, view: true, procedure: true, java: true };
      document.querySelectorAll('.chip[data-type]').forEach((b) => b.setAttribute('aria-pressed', 'true'));
      render();
    }
    function applyScale(scale) {
      showLoading(scale === 'large' ? '正在准备 520 个对象的下游树，默认只展开 1 层。' : '正在切换到 16 对象样例，便于看清跨支虚线。');
      window.setTimeout(() => {
        try {
          state.scale = scale; state.expanded = {}; state.openCols = {}; state.openGroups = {};
          state.depth = scale === 'large' ? 1 : 99;
          loadCatalog(); fillSeed();
          syncDepthButtons();
          document.querySelectorAll('[data-scale]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.scale === state.scale)));
          render();
          hideCanvasState();
        } catch (err) {
          showError(String(err && err.message || err));
        }
      }, 40);
    }
    function render() {
      save();
      document.getElementById('why').textContent = HINTS[state.mode];
      document.querySelectorAll('.modes button').forEach((b) => {
        const on = b.dataset.mode === state.mode;
        b.setAttribute('aria-selected', String(on));
        b.tabIndex = on ? 0 : -1;
      });
      const c = counts(); const vis = visibleIds().length;
      const downParts = Object.entries(c.by).filter(([, n]) => n).map(([t, n]) => `${t === 'java' ? 'Java 终端' : TYPES[t].label} ${n}`).join(' · ');
      document.getElementById('lead').innerHTML = `以 <b>${esc(byId[state.seed].name)}</b> 为根，只画下游：<b>${c.down}</b> 个对象（${downParts || '无'}），其中 Java 终端 <b>${c.leaves}</b> 个。跨支关联 <b>${c.crossN}</b> 条。当前画出 <b>${vis}</b> 个可见节点。`;
      const stage = document.getElementById('stage');
      try {
        if (state.mode === 'focus') stage.innerHTML = renderMap('focus');
        else if (state.mode === 'overview') stage.innerHTML = renderMap('overview');
        else if (state.mode === 'impact') stage.innerHTML = renderImpact();
        else stage.innerHTML = renderPath();
        renderInspector(); renderHits();
        if (state.mode === 'focus' || state.mode === 'overview') requestAnimationFrame(() => drawEdges(stage));
      } catch (err) {
        showError(String(err && err.message || err));
      }
    }
    function syncDepthButtons() {
      document.querySelectorAll('[data-depth]').forEach((x) => x.setAttribute('aria-pressed', String(Number(x.dataset.depth) === state.depth)));
    }
    function reveal(id) {
      if (!byId[id]) return;
      if (byId[id].type === 'table' && !TREE.reach.has(id) && id !== state.seed) { recenter(id); return; }
      if (!TREE.reach.has(id)) return;
      state.sel = id;
      if (mqMobile.matches) state.inspectOpen = true;
      const hop = colOf(id);
      if (state.depth !== 99 && hop > state.depth) {
        state.depth = hop <= 2 ? hop : 99;
        if (state.depth === 99) state.mode = 'overview';
        syncDepthButtons();
      }
      treePath(id).forEach((pid) => { if (pid !== id) state.expanded[pid] = true; });
      state.openCols[String(hop)] = true;
      state.openCols[hop + ':' + byId[id].type] = true;
      state.openGroups['down:' + byId[id].type] = true;
    }
    function recenter(id) {
      if (!byId[id] || byId[id].type !== 'table') return;
      state.seed = id; state.sel = id; state.expanded = {};
      TREE = buildTree(state.seed);
      fillSeed(); render();
    }
    function fillSeed() {
      const sel = document.getElementById('seed');
      sel.innerHTML = '';
      NODES.filter((n) => n.type === 'table' && (n.named || n.id === state.seed)).forEach((n) => {
        const o = document.createElement('option');
        o.value = n.id; o.textContent = `${n.title}  ${n.name}`;
        if (n.id === state.seed) o.selected = true;
        sel.appendChild(o);
      });
    }
    function inField(el) {
      const tag = (el && el.tagName) || '';
      return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (el && el.isContentEditable);
    }
    let bound = false;
    function bind() {
      if (bound) return;
      bound = true;
      fillSeed();
      document.getElementById('seed').addEventListener('change', (e) => recenter(e.target.value));
      document.getElementById('q').value = state.q;
      document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderHits(); });
      document.getElementById('hits').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-id]'); if (!btn) return;
        reveal(btn.getAttribute('data-id')); state.q = ''; document.getElementById('q').value = '';
        document.getElementById('hits').hidden = true; render();
      });
      document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      document.querySelector('.modes').addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        const i = MODES.indexOf(state.mode);
        const next = MODES[(i + (e.key === 'ArrowRight' ? 1 : -1) + MODES.length) % MODES.length];
        setMode(next);
        document.querySelector(`[data-mode="${next}"]`).focus();
      });
      document.querySelectorAll('[data-scale]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.scale === state.scale));
        b.addEventListener('click', () => applyScale(b.dataset.scale));
      });
      document.querySelectorAll('.chip[data-type]').forEach((b) => {
        b.setAttribute('aria-pressed', String(state.types[b.dataset.type]));
        b.addEventListener('click', () => { state.types[b.dataset.type] = !state.types[b.dataset.type]; b.setAttribute('aria-pressed', String(state.types[b.dataset.type])); render(); });
      });
      document.querySelectorAll('[data-depth]').forEach((b) => {
        b.setAttribute('aria-pressed', String(Number(b.dataset.depth) === state.depth));
        b.addEventListener('click', () => {
          state.depth = Number(b.dataset.depth);
          if (state.depth === 99 && state.scale === 'large') state.mode = 'overview';
          syncDepthButtons();
          render();
        });
      });
      document.getElementById('inspect-toggle').addEventListener('click', () => {
        state.inspectOpen = !state.inspectOpen;
        syncInspectBar(byId[state.sel] || byId[state.seed]);
        save();
      });
      const onStage = (e) => {
        const action = e.target.closest('[data-action]');
        if (action) {
          const v = action.getAttribute('data-action');
          if (v === 'reset-types') resetTypes();
          else if (v === 'retry') { hideCanvasState(); render(); }
          else if (v === 'scale-small') applyScale('small');
          return;
        }
        const openCol = e.target.closest('[data-open-col]');
        if (openCol) { const k = openCol.getAttribute('data-open-col'); state.openCols[k] = !state.openCols[k]; render(); return; }
        const openG = e.target.closest('[data-open-group]');
        if (openG) { const k = openG.getAttribute('data-open-group'); state.openGroups[k] = !state.openGroups[k]; render(); return; }
        const exp = e.target.closest('[data-expand]');
        if (exp) { const id = exp.getAttribute('data-expand'); state.expanded[id] = !state.expanded[id]; state.sel = id; render(); return; }
        const rec = e.target.closest('[data-recenter]');
        if (rec) { recenter(rec.getAttribute('data-recenter')); return; }
        const btn = e.target.closest('[data-id]');
        if (!btn) return;
        state.sel = btn.getAttribute('data-id');
        if (mqMobile.matches) state.inspectOpen = true;
        render();
      };
      document.getElementById('stage').addEventListener('click', onStage);
      document.getElementById('inspector').addEventListener('click', onStage);
      document.getElementById('canvas-state').addEventListener('click', onStage);
      document.getElementById('stage').addEventListener('dblclick', (e) => {
        const btn = e.target.closest('[data-id]'); if (!btn) return;
        const id = btn.getAttribute('data-id');
        if (byId[id] && byId[id].type === 'table') recenter(id);
      });
      document.getElementById('stage').addEventListener('change', (e) => {
        if (e.target.id === 'path-to') { state.pathTo = e.target.value; render(); }
      });
      window.addEventListener('resize', () => {
        syncInspectBar(byId[state.sel] || byId[state.seed]);
        if (state.mode === 'focus' || state.mode === 'overview') drawEdges(document.getElementById('stage'));
      });
      document.addEventListener('keydown', (e) => {
        const hitsOpen = !document.getElementById('hits').hidden;
        if (hitsOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); moveHit(e.key === 'ArrowDown' ? 1 : -1); return; }
        if (hitsOpen && e.key === 'Enter' && document.activeElement.id === 'q') { e.preventDefault(); chooseHit(); return; }
        if (e.key === '/' && !inField(document.activeElement)) {
          e.preventDefault(); document.getElementById('q').focus();
        }
        if (e.key === 'Escape') {
          const hits = document.getElementById('hits');
          if (!hits.hidden || state.q) {
            state.q = ''; document.getElementById('q').value = ''; hits.hidden = true; hits.innerHTML = '';
            document.getElementById('q').setAttribute('aria-expanded', 'false');
            return;
          }
          if (state.sel !== state.seed) { state.sel = state.seed; render(); }
        }
        if (['1', '2', '3', '4'].includes(e.key) && !inField(document.activeElement)) {
          setMode({ 1: 'focus', 2: 'overview', 3: 'impact', 4: 'path' }[e.key]);
        }
      });
    }
    try {
      loadCatalog();
      bind();
      render();
    } catch (err) {
      bind();
      showError(String(err && err.message || err));
    }
  </script>
</body>
</html>
