# Disposable local PostgreSQL 17 for DatabaseRelationMap.
# Data lives in the named volume lineage_pg_data.
# Destroy everything: docker compose -f deploy/docker-compose.yml down -v
#
# Not production. No SSO. No real lineage data.

name: lineage-local

services:
  postgres:
    image: postgres:17
    container_name: lineage-pg-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lineage}
      POSTGRES_USER: ${POSTGRES_USER:-lineage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lineage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  lineage_pg_data:
    name: lineage_pg_data
